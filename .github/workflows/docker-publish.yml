name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'readme.md'
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  metadata:
    name: Metadata
    runs-on: ubuntu-latest
    outputs:
      latest_tag: ${{ steps.latest.outputs.latest_tag }}
      prev_tag: ${{ steps.prev.outputs.prev_tag }}
      should_build: ${{ steps.decide.outputs.should_build }}
      image_name: ${{ steps.tags.outputs.image_name }}
      cache_hit: ${{ steps.restore-tag-cache.outputs.cache-hit }}

    steps:
      - name: Fetch latest codex tag
        id: latest
        run: |
          set -euo pipefail
          latest="$(git ls-remote --tags https://github.com/openai/codex.git \
            | awk -F/ '{print $NF}' \
            | sed 's/\^{}//' \
            | grep -E '^rust-v[0-9]+(\.[0-9]+)*$' \
            | sort -u -V \
            | tail -n1)"
          echo "latest_tag=$latest" >> "$GITHUB_OUTPUT"

      - name: Restore cached tag
        id: restore-tag-cache
        uses: actions/cache/restore@v5
        with:
          path: .cache
          key: codex-tag-${{ steps.latest.outputs.latest_tag }}
          restore-keys: |
            codex-tag-

      - name: Read previous tag
        id: prev
        run: |
          set -euo pipefail
          if [ -f .cache/codex_tag.txt ]; then
            prev="$(cat .cache/codex_tag.txt)"
          else
            prev=""
          fi
          echo "prev_tag=$prev" >> "$GITHUB_OUTPUT"

      - name: Decide whether to build
        id: decide
        run: |
          set -euo pipefail
          latest="${{ steps.latest.outputs.latest_tag }}"
          prev="${{ steps.prev.outputs.prev_tag }}"
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$prev" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif [ "$latest" != "$prev" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare image tags
        id: tags
        run: |
          echo "image_name=${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"

      - name: Decision summary
        run: |
          echo "Latest tag: ${{ steps.latest.outputs.latest_tag }}"
          echo "Cached tag: ${{ steps.prev.outputs.prev_tag }}"
          echo "Should build: ${{ steps.decide.outputs.should_build }}"

  build-base:
    name: Build base image ${{ matrix.arch }}
    needs: metadata
    if: needs.metadata.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs_on: ubuntu-latest
          - arch: arm64
            runs_on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs_on }}

    steps:
      - name: Set up zram
        run: |
          sudo apt update
          sudo apt install -y linux-modules-extra-$(uname -r)

          for dev in $(zramctl --noheadings -o NAME 2>/dev/null || true); do
            echo "Disabling /dev/$dev"
            sudo swapoff "/dev/$dev" || echo "swapoff failed for $dev"
            echo "Resetting /dev/$dev"
            sudo zramctl --reset "/dev/$dev" || echo "reset failed for $dev"
          done

          sudo modprobe -r zram || echo "modprobe -r failed"
          sudo modprobe zram

          echo "Creating new zram device"
          dev=$(sudo zramctl --find --algorithm zstd --size 32G)

          echo "Created $dev"
          sudo mkswap $dev
          sudo swapon --priority 100 $dev

          echo "Final state:"
          swapon --show
          zramctl

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Restore Cargo cache
        id: restore-cargo-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/.cache
          key: cargo-cache-${{ matrix.arch }}-${{ hashFiles('base.dockerfile') }}-${{ needs.metadata.outputs.latest_tag }}
          restore-keys: |
            cargo-cache-${{ matrix.arch }}-${{ hashFiles('base.dockerfile') }}-

      - name: Ensure Cargo cache dir exists
        run: mkdir -p "${RUNNER_TEMP}/.cache"

      - name: Build base image
        uses: redhat-actions/buildah-build@061ffd31bb5c3f8733a6f9bbdf00a9fb02eb708c
        with:
          image: localhost/codex-base
          tags: ${{ matrix.arch }}
          containerfiles: ./base.dockerfile
          extra-args: |
            --volume ${{ runner.temp }}/.cache:/cargo-cache:rw,U
          build-args: |
            VERSION=${{ needs.metadata.outputs.latest_tag }}

      - name: Save Cargo cache
        if: ${{ success() && steps.restore-cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/.cache
          key: ${{ steps.restore-cargo-cache.outputs.cache-primary-key }}

      - name: Save OCI archive
        run: |
          mkdir -p "${RUNNER_TEMP}/out"
          podman save --format oci-archive -o "${RUNNER_TEMP}/out/base-${{ matrix.arch }}.tar" "localhost/codex-base:${{ matrix.arch }}"

      - name: Upload OCI archive
        uses: actions/upload-artifact@v7
        with:
          name: image-base-${{ matrix.arch }}
          path: ${{ runner.temp }}/out/base-${{ matrix.arch }}.tar
          retention-days: 1
          compression-level: 0

  build-distro:
    name: Build ${{ matrix.dist }} ${{ matrix.arch }}
    needs:
      - metadata
      - build-base
    strategy:
      fail-fast: false
      matrix:
        include:
          # alpine
          - dist: alpine
            final_image: docker.io/alpine:latest
            arch: amd64
            runs_on: ubuntu-latest
          - dist: alpine
            final_image: docker.io/alpine:3.23
            arch: arm64
            runs_on: ubuntu-24.04-arm
          # void
          - dist: void
            final_image: ghcr.io/void-linux/void-glibc-busybox:latest
            arch: amd64
            runs_on: ubuntu-latest
          - dist: void
            final_image: ghcr.io/void-linux/void-glibc-busybox:latest
            arch: arm64
            runs_on: ubuntu-24.04-arm
          # debian
          - dist: debian
            final_image: docker.io/debian:trixie-slim
            arch: amd64
            runs_on: ubuntu-latest
          - dist: debian
            final_image: docker.io/debian:trixie-slim
            arch: arm64
            runs_on: ubuntu-24.04-arm
          # fedora
          - dist: fedora
            final_image: quay.io/fedora/fedora-minimal:latest
            arch: amd64
            runs_on: ubuntu-latest
          - dist: fedora
            final_image: quay.io/fedora/fedora-minimal:latest
            arch: arm64
            runs_on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs_on }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download base OCI archive
        uses: actions/download-artifact@v8
        with:
          name: image-base-${{ matrix.arch }}
          path: ${{ runner.temp }}/in

      - name: Load base image into local storage
        run: podman load -i "${RUNNER_TEMP}/in/base-${{ matrix.arch }}.tar"

      - name: Build distro image
        uses: redhat-actions/buildah-build@061ffd31bb5c3f8733a6f9bbdf00a9fb02eb708c
        with:
          image: ${{ needs.metadata.outputs.image_name }}
          tags: ci-${{ matrix.dist }}-${{ matrix.arch }}
          containerfiles: ./dockerfile
          build-args: |
            FINAL_IMAGE=${{ matrix.final_image }}
            BASE_IMAGE=localhost/codex-base:${{ matrix.arch }}

      - name: Save OCI archive
        run: |
          mkdir -p "${RUNNER_TEMP}/out"
          podman save --format oci-archive -o "${RUNNER_TEMP}/out/${{ matrix.dist }}-${{ matrix.arch }}.tar" "${{ needs.metadata.outputs.image_name }}:ci-${{ matrix.dist }}-${{ matrix.arch }}"

      - name: Upload OCI archive
        uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.dist }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/out/${{ matrix.dist }}-${{ matrix.arch }}.tar
          retention-days: 1
          compression-level: 0

  publish-distro:
    name: Publish ${{ matrix.dist }} manifest
    needs:
      - metadata
      - build-distro
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dist: alpine
            tags: "latest alpine"
          - dist: void
            tags: "void"
          - dist: debian
            tags: "debian"
          - dist: fedora
            tags: "fedora"

    steps:
      - name: Download OCI archives
        uses: actions/download-artifact@v8
        with:
          pattern: image-${{ matrix.dist }}-*
          path: ${{ runner.temp }}/in
          merge-multiple: true

      - name: Load images into local storage
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            podman load -i "${RUNNER_TEMP}/in/${{ matrix.dist }}-${arch}.tar"
          done

      - name: Log in to GitHub Container Registry
        uses: redhat-actions/podman-login@2e76993ec4585e058ea832c23ee3d885970936af
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create & push multi-arch tags
        run: |
          set -euxo pipefail
          IMAGE="ghcr.io/${{ github.repository }}"
          AMD="${IMAGE}:ci-${{ matrix.dist }}-amd64"
          ARM="${IMAGE}:ci-${{ matrix.dist }}-arm64"

          for t in ${{ matrix.tags }}; do
            podman manifest rm "${IMAGE}:${t}" 2>/dev/null || true
            podman manifest create "${IMAGE}:${t}"
            podman manifest add "${IMAGE}:${t}" "containers-storage:${AMD}"
            podman manifest add "${IMAGE}:${t}" "containers-storage:${ARM}"
            podman manifest push --all "${IMAGE}:${t}" "docker://${IMAGE}:${t}"
          done

  save-cache:
    name: Save latest codex tag cache
    needs:
      - metadata
      - publish-distro
    runs-on: ubuntu-latest
    if: ${{ needs.publish-distro.result == 'success' && needs.metadata.outputs.cache_hit != 'true' }}

    steps:
      - name: Save latest tag cache
        run: |
          set -euo pipefail
          mkdir -p .cache
          echo "${{ needs.metadata.outputs.latest_tag }}" > .cache/codex_tag.txt

      - name: Persist tag cache
        uses: actions/cache/save@v5
        with:
          path: .cache
          key: codex-tag-${{ needs.metadata.outputs.latest_tag }}
